[project]
name = "tracing"
version = "0.1.0"
description = "LLM tracing and failure forensics for the hybrid RAG pipeline"
readme = "README.md"
authors = [
    { name = "fkiptooh-r", email = "fkiptooh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
trace-demo = "tracing.demo:main"
trace-view = "tracing.view:main"
langfuse-setup = "tracing.langfuse_setup:main"
failure-candidates = "tracing.taxonomy:main_candidates"
taxonomy = "tracing.taxonomy:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: errors, I: import sorting, B: likely bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
