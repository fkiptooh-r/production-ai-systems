[project]
name = "foundations"
version = "0.1.0"
description = "Foundations: LLM API calls, structured output, tool calling, FastAPI, deployment"
readme = "README.md"
authors = [
    { name = "fkiptooh-r", email = "fkiptooh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "shared",
    "uvicorn>=0.54.0",
]

[project.scripts]
chat = "foundations.chat:main"
extract-eval = "foundations.extract_eval:main"
agent = "foundations.agent:main"
tool-eval = "foundations.tool_eval:main"
serve = "foundations.api:serve"
db-init = "foundations.db:init_db"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: errors, I: import sorting, B: likely bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
shared = { path = "../shared", editable = true }
