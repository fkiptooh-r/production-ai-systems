# Database only (for `uv run serve`):   docker compose up -d
# Database + API in containers:         docker compose --profile api up -d --build
# Stop everything (keeps data):         docker compose --profile api down
services:
  postgres:
    # Postgres 17 with the pgvector extension, which project 01 (hybrid RAG) will need.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only; never reuse in production
      POSTGRES_DB: ai_systems
    ports:
      # 5433 on this machine, because a Windows Postgres service already uses 5432.
      # Bound to 127.0.0.1 so only this computer can connect, not the whole network.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives container restarts
      - ./sql:/docker-entrypoint-initdb.d:ro # schema.sql runs on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_systems"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: ["api"] # only started when asked for, so `docker compose up -d` stays DB-only
    ports:
      # Change the host port if 8000 is busy, e.g. API_PORT=8001 docker compose --profile api up -d
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      # Inside Docker, services reach each other by service name on the internal port.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_systems
      # Ollama runs on the Windows host, not in a container; this name points to the host.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
