[project]
name = "rag"
version = "0.1.0"
description = "Tenant-aware hybrid RAG: keyword + semantic search, reranking, cited answers"
readme = "README.md"
authors = [
    { name = "fkiptooh-r", email = "fkiptooh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "shared",
]

[project.scripts]
ingest = "rag.ingest:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: errors, I: import sorting, B: likely bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
